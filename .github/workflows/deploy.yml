name: Deploy to Render

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Test & Deploy to Render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests (CI Quality Gate)
        run: ./gradlew test --no-daemon

      - name: Trigger Render Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "🚀 Triggering Render Deployment via Deploy Hook..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$DEPLOY_HOOK")
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "Render API Response Status: $HTTP_STATUS"
            echo "Render API Response Body: $BODY"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Render deployment successfully triggered!"
            else
              echo "❌ Failed to trigger Render deployment (HTTP $HTTP_STATUS)"
              exit 1
            fi
          else
            echo "ℹ️ RENDER_DEPLOY_HOOK_URL 시크릿이 설정되지 않아 Render 기본 GitHub 자동 배포(Auto-Deploy)를 사용합니다."
            echo "GitHub Actions에서 즉시 배포를 트리거하려면 GitHub Repository Secrets에 'RENDER_DEPLOY_HOOK_URL'을 등록해 주세요."
          fi

      - name: Verify Live Server Health
        run: |
          echo "Waiting 5s before checking server health..."
          sleep 5
          SERVER_URL="https://pr-guard-server.onrender.com/api/ping"
          echo "Checking $SERVER_URL ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVER_URL" || echo "000")
          echo "Ping response: $HTTP_STATUS"

