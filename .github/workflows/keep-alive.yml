name: Render Keep-Alive

on:
  schedule:
    # Render 무료 티어의 15분 절전 모드(Sleep) 방지를 위해 10분마다 실행
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Render Server
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive Endpoint
        run: |
          echo "Sending keep-alive ping to Render server..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://pr-guard-server.onrender.com/api/ping)
          echo "Server responded with HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Render server is active and healthy!"
          else
            echo "Unexpected status code: $HTTP_STATUS"
            exit 1
          fi

