spring.application.name=prguard
server.port=${PORT:8080}
spring.config.import=optional:application-local.properties

# ===================================================================
# Google Gemini AI 보안 분석 엔진 설정
# ===================================================================
# Google AI Studio에서 발급받은 API 키를 설정하거나 환경 변수(GEMINI_API_KEY)로 주입하세요.
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}

# ===================================================================
# GitHub App & Webhook 보안 설정
# ===================================================================
# GitHub App ID (환경 변수 GITHUB_APP_ID 권장)
github.app.id=${GITHUB_APP_ID:}
# GitHub Webhook HMAC 서명 검증 시크릿 (선택 사항 - 비워둘 경우 서명 검증 스킵)
github.webhook.secret=${GITHUB_WEBHOOK_SECRET:}
# GitHub App Private Key 경로 (미지정 시 /etc/secrets, 클래스패스, 루트의 *.pem 자동 탐색)
github.app.private-key-path=${GITHUB_APP_PRIVATE_KEY_PATH:}
# GitHub App Private Key 텍스트 자체를 환경변수로 직접 주입할 경우 사용
github.app.private-key=${GITHUB_APP_PRIVATE_KEY:}
# 웹훅 페이로드에 installation.id 가 없을 경우 사용할 기본 설치 ID (선택 사항)
github.app.default-installation-id=${GITHUB_INSTALLATION_ID:}

# ===================================================================
# GitHub API & 엔터프라이즈 서버(GHES) 설정
# ===================================================================
github.api.url=${GITHUB_API_URL:https://api.github.com}
github.check-run.name=${GITHUB_CHECK_RUN_NAME:PR Guard / Security Scan}
github.status.context=${GITHUB_STATUS_CONTEXT:pr-guard/security}
github.status.enabled=${GITHUB_STATUS_ENABLED:true}
github.bot.name=${GITHUB_BOT_NAME:prguard}
github.security-label=${GITHUB_SECURITY_LABEL:security-risk}

# ===================================================================
# Trivy 및 프로세스 성능 / 타임아웃 튜닝
# ===================================================================
trivy.process.timeout-minutes=${TRIVY_PROCESS_TIMEOUT_MINUTES:5}
trivy.db.update-interval-hours=${TRIVY_DB_UPDATE_INTERVAL_HOURS:12}
trivy.executable=${TRIVY_EXECUTABLE:}
scanner.wrapper.enabled=${SCANNER_WRAPPER_ENABLED:true}
diff.max-length=${DIFF_MAX_LENGTH:15000}
pipeline.max-inline-comments=${MAX_INLINE_COMMENTS:5}
pipeline.dedup-window-minutes=${DEDUP_WINDOW_MINUTES:10}
